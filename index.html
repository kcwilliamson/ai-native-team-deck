<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Build an AI-native team</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400&family=Hanken+Grotesk:wght@400;600&family=Newsreader:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F0EBDE; --paper2:#E6E0CE; --ink:#1F2BE0; --soft:#5560E5;
  --grid:rgba(31,43,224,.10); --faint:rgba(31,43,224,.18);
  --serif:'Newsreader',Georgia,serif; --sans:'Hanken Grotesk',system-ui,sans-serif; --mono:'DM Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#1F2BE0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.deck-viewport{position:fixed;inset:0;overflow:hidden;background:#1F2BE0}
.deck-stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:var(--paper);overflow:hidden;color:var(--ink);font-family:var(--sans)}
.deck-stage::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:44px 44px}
.slide{position:absolute;inset:0;opacity:0;visibility:hidden;overflow:hidden;z-index:1}
.slide.active{opacity:1;visibility:visible}
.slide.leaving{visibility:visible;opacity:0;transition:opacity .28s}
.slide.incoming{visibility:visible;opacity:1;z-index:5;animation:reveal .95s cubic-bezier(.7,0,.2,1) both}
@keyframes reveal{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}

.slide::before,.slide::after{content:"";position:absolute;left:70px;right:70px;height:1.5px;background:var(--ink);z-index:3}
.slide::before{top:28px}.slide::after{bottom:22px}
.pagenum{position:absolute;right:132px;bottom:50px;font:400 22px/1 var(--mono);letter-spacing:.06em;z-index:4}
.moreBtn{position:absolute;left:70px;bottom:40px;z-index:9;font:400 20px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;border:1.5px solid var(--ink);padding:10px 16px;background:var(--paper)}
.gridBtn{position:absolute;right:70px;bottom:40px;z-index:9;width:44px;height:44px;border:1.5px solid var(--ink);background:var(--paper);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.gridBtn:hover{background:var(--ink)}.gridBtn:hover rect{fill:var(--paper)}
.moreBtn:hover{background:var(--ink);color:var(--paper)}
.micro{font:600 22px/1.2 var(--sans);letter-spacing:.2em;text-transform:uppercase}
.labtag{font:400 22px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase}
.mono{font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase}
.serif{font-family:var(--serif);font-weight:400;letter-spacing:-.008em}
.serif em{font-style:italic}
.t-xl{font-size:186px;line-height:.98}.t-l{font-size:140px;line-height:1}.t-m{font-size:104px;line-height:.98}
.abs{position:absolute}
.topbar{position:absolute;left:70px;right:70px;top:90px;display:flex;justify-content:space-between;align-items:flex-end;padding-bottom:20px;z-index:3}
.line{display:block;overflow:hidden;padding:4px 0 10px}.line span{display:inline-block}

.meter{position:absolute;left:50%;bottom:48px;transform:translateX(-50%);display:flex;gap:22px;z-index:4;align-items:flex-end}
.meter .grp{display:flex;flex-direction:column;gap:8px;align-items:center}
.meter .cells{display:flex;gap:3px}.meter .cells i{display:block;width:13px;height:13px;background:var(--grid)}
.meter .cells i.on{animation:cellon .3s both}
@keyframes cellon{from{background:var(--grid)}to{background:var(--ink)}}
.meter .grp:not(.ph) .lab{opacity:.45}.meter .grp.ph .lab{opacity:1}
.meter .lab{font:400 15px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;opacity:.7}

.qr{position:absolute;width:150px;height:150px;padding:7px;background:var(--paper);box-shadow:0 0 0 1.5px var(--paper);display:grid;grid-template-columns:repeat(8,1fr);z-index:4}
.qr i{display:block}.qr i.on{background:var(--ink)}
.glitch{position:absolute;pointer-events:none;z-index:2}

/* motion primitives */
.in{opacity:0}
.slide.active .in{animation:up .65s cubic-bezier(.2,.9,.2,1) both;animation-delay:calc(var(--d,0)*1s)}
@keyframes up{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.slide.active .inL{animation:inL .65s cubic-bezier(.2,.9,.2,1) both;animation-delay:calc(var(--d,0)*1s)}
.inL{opacity:0}
@keyframes inL{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
.slide.active .wipeR{animation:wipeR .8s cubic-bezier(.7,0,.2,1) both;animation-delay:calc(var(--d,0)*1s)}
.wipeR{clip-path:inset(0 100% 0 0)}
@keyframes wipeR{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.slide.active .rise span{animation:rise .85s cubic-bezier(.2,.9,.2,1) both;animation-delay:calc(var(--d,0)*1s)}
@keyframes rise{from{transform:translateY(108%)}to{transform:none}}
.d{fill:none;stroke:var(--ink);stroke-width:2;stroke-dasharray:1;stroke-dashoffset:1}
.slide.active .d{animation:draw 1.2s cubic-bezier(.5,0,.2,1) both;animation-delay:calc(var(--d,0)*1s)}
@keyframes draw{to{stroke-dashoffset:0}}
.dl{font:400 20px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;fill:var(--ink);opacity:0}
.slide.active .dl{animation:fadein .6s both;animation-delay:calc(var(--d,0)*1s)}
@keyframes fadein{to{opacity:1}}
.fillrect{fill:var(--ink);opacity:0}
.slide.active .fillrect{animation:fadein .5s both;animation-delay:calc(var(--d,0)*1s)}
.slide.active .bob{animation:bob 2.4s ease-in-out infinite;animation-delay:calc(var(--d,0)*1s)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}

/* ---- per-layout ---- */
.cardbox{border:1.5px solid var(--ink);background:var(--paper)}
.big4{position:absolute;left:70px;right:70px;top:250px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}
.big4 .c{height:640px;border:1.5px solid var(--ink);background:var(--paper);position:relative;display:flex;flex-direction:column;justify-content:space-between;padding:30px 32px}
.big4 .g{font:400 280px/.9 var(--serif)}
.big4 .w{font:400 68px/1 var(--serif);letter-spacing:-.01em}
.idx{position:absolute;left:70px;right:70px;top:280px;display:grid;grid-template-columns:1fr 1fr;column-gap:60px}
.idx .r{display:grid;grid-template-columns:90px 1fr;align-items:center;height:210px}
.idx .n{font:400 28px/1 var(--mono);letter-spacing:.06em}
.idx .h{font:400 74px/1 var(--serif);letter-spacing:-.01em}
.led{position:absolute;left:70px;right:70px;top:290px}
.led .r{display:grid;grid-template-columns:330px 1fr;align-items:center;min-height:210px;padding:10px 0}
.led .k{font:600 24px/1.2 var(--sans);letter-spacing:.2em;text-transform:uppercase}
.led .v{font:400 62px/1.08 var(--serif);letter-spacing:-.008em}
.tiles5{position:absolute;left:70px;right:70px;top:300px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:20px}
.tiles5 .t{height:520px;border:1.5px solid var(--ink);padding:26px;display:flex;flex-direction:column;justify-content:space-between;background:var(--paper)}
.tiles5 .t .n{font:400 22px/1 var(--mono);letter-spacing:.08em}
.tiles5 .t .h{font:400 70px/.98 var(--serif);letter-spacing:-.01em}
.cols4{position:absolute;left:70px;right:70px;top:300px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}
.cols4 .t{height:540px;border:1.5px solid var(--ink);padding:30px;display:flex;flex-direction:column;justify-content:space-between;background:var(--paper)}
.cols4 .h{font:400 94px/.95 var(--serif);letter-spacing:-.012em}
.cols4 .s{font:400 26px/1.3 var(--mono);letter-spacing:.04em}
.cards3{position:absolute;left:70px;right:70px;top:290px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:30px}
.cards3 .t{height:600px;border:1.5px solid var(--ink);padding:36px;display:flex;flex-direction:column;justify-content:space-between;background:var(--paper)}
.cards3 .t.hot{border-width:5px}.cards3 .t.hot .n::after{content:'the real work';background:var(--ink);color:var(--paper);padding:3px 8px;margin-left:8px}
.cards3 .n{font:400 24px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase}
.cards3 .h{font:400 64px/1.05 var(--serif);letter-spacing:-.01em}
.cards3 .u{height:200px;border:1.5px solid var(--ink);position:relative;overflow:hidden}
.chain{position:absolute;left:70px;right:70px;top:380px;display:flex;align-items:stretch}
.chain .l{flex:1;border:1.5px solid var(--ink);background:var(--paper);height:300px;padding:24px;display:flex;flex-direction:column;justify-content:space-between}
.chain .l .n{font:400 22px/1 var(--mono);letter-spacing:.08em}
.chain .l .h{font:400 52px/1.02 var(--serif);letter-spacing:-.01em}
.chain .a{width:56px;display:flex;align-items:center;justify-content:center;font:400 42px/1 var(--mono)}
.mockwin{border:1.5px solid var(--ink);background:var(--paper);position:absolute}
.mockwin .bar{height:48px;border-bottom:1.5px solid var(--ink);display:flex;align-items:center;gap:10px;padding:0 18px}
.mockwin .bar i{display:block;width:14px;height:14px;border:1.5px solid var(--ink)}
.type{display:inline-block;overflow:hidden;white-space:nowrap;border-right:3px solid var(--ink);width:0}
.slide.active .type{animation:typing 3.2s steps(46,end) both, caret .7s step-end infinite;animation-delay:calc(var(--d,0)*1s)}
@keyframes typing{from{width:0}to{width:var(--w,100%)}}
@keyframes caret{50%{border-color:transparent}}
.chip{display:inline-block;border:1.5px solid var(--ink);padding:14px 22px;font:400 24px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;background:var(--paper)}
.drift{position:absolute;font:400 70px/1 var(--serif);color:var(--ink);opacity:.14;white-space:nowrap}
.slide.active .drift{animation:drift 14s linear infinite;animation-delay:calc(var(--d,0)*-1s)}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-280px)}}
.pile{position:absolute;font:400 64px/1 var(--serif);white-space:nowrap;opacity:0}
.slide.active .pile{animation:pilein .5s both, pileout .6s 3.4s both;animation-delay:calc(var(--d,0)*1s),3.4s}
@keyframes pilein{from{opacity:0;transform:scale(.6) rotate(var(--r,0deg))}to{opacity:1;transform:rotate(var(--r,0deg))}}
@keyframes pileout{to{opacity:0;transform:scale(.4) rotate(var(--r,0deg))}}
.flip{perspective:1400px}
.flip .face{backface-visibility:hidden;position:absolute;inset:0;padding:30px;display:flex;flex-direction:column;justify-content:space-between;border:1.5px solid var(--ink);background:var(--paper)}
.flip .back{transform:rotateY(180deg);background:var(--ink);color:var(--paper)}
.flip .inner{position:absolute;inset:0;transform-style:preserve-3d}
.slide.active .flip .inner{animation:flipc 10s ease-in-out infinite;animation-delay:calc(var(--d,0)*1s)}
@keyframes flipc{0%,22%{transform:rotateY(0)}30%,62%{transform:rotateY(180deg)}70%,100%{transform:rotateY(0)}}

/* strike on text */
.strike{background:linear-gradient(var(--ink),var(--ink)) no-repeat 0 58%/0% 4px}
.slide.active .strike{animation:strikego .7s both;animation-delay:calc(var(--d,0)*1s)}
@keyframes strikego{from{background-size:0% 4px}to{background-size:100% 4px}}

/* drawer */
.drawer{position:absolute;top:60px;right:70px;bottom:60px;width:760px;z-index:30;background:var(--paper);border:1.5px solid var(--ink);padding:42px 46px;transform:translateX(900px);transition:transform .45s cubic-bezier(.7,0,.2,1);overflow:auto}
.drawer.open{transform:none}
.drawer .k{font:400 20px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;display:flex;justify-content:space-between;border-bottom:1.5px solid var(--ink);padding-bottom:16px}
.drawer h3{font:400 64px/1.02 var(--serif);letter-spacing:-.01em;margin:30px 0 24px}
.drawer p{font:400 31px/1.45 var(--sans)}
.drawer .x{font:400 20px/1 var(--mono);text-transform:uppercase;letter-spacing:.1em}

/* reading view */
#read{position:fixed;inset:0;z-index:100;background:var(--paper);color:var(--ink);overflow:auto;display:none;padding:60px 0 120px}
#read.on{display:block}
#read .w{max-width:880px;margin:0 auto;padding:0 28px}
#read h1{font:400 56px/1.05 var(--serif);margin-bottom:10px}
#read .tip{font:400 15px/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase;margin-bottom:40px;opacity:.7}
#read .it{border-top:1.5px solid var(--ink);padding:22px 0 26px}
#read .it .n{font:400 14px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px;display:flex;justify-content:space-between}
#read .it h2{font:400 34px/1.1 var(--serif);margin-bottom:10px}
#read .it p{font:400 18px/1.55 var(--sans)}
#read .it a{color:inherit}

/* transitions */
.fx{position:absolute;inset:0;z-index:60;pointer-events:none}
.px{visibility:hidden}.px.fill,.px.clear{visibility:visible}
.px i{position:absolute;width:80.5px;height:80.5px;background:var(--ink);transform:scale(0)}
.px.fill i{animation:pxin .3s cubic-bezier(.3,0,.3,1) both;animation-delay:calc(var(--d)*1ms)}
.px.clear i{animation:pxout .3s cubic-bezier(.3,0,.3,1) both;animation-delay:calc(var(--d)*1ms)}
@keyframes pxin{from{transform:scale(0)}to{transform:scale(1.03)}}
@keyframes pxout{from{transform:scale(1.03)}to{transform:scale(0)}}
.bl{visibility:hidden}.bl.fill,.bl.clear{visibility:visible}
.bl i{position:absolute;top:0;width:241px;height:1080px;background:var(--ink);transform:scaleY(0)}
.bl.fill i{transform-origin:top;animation:blin .45s cubic-bezier(.6,0,.3,1) both;animation-delay:calc(var(--d)*1ms)}
.bl.clear i{transform-origin:bottom;animation:blout .45s cubic-bezier(.6,0,.3,1) both;animation-delay:calc(var(--d)*1ms)}
@keyframes blin{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes blout{from{transform:scaleY(1)}to{transform:scaleY(0)}}
.scan{visibility:hidden;background:var(--ink);transform:scaleX(0)}
.scan.in{visibility:visible;transform-origin:left;animation:scin .5s cubic-bezier(.7,0,.3,1) both}
.scan.out{visibility:visible;transform-origin:right;animation:scout .5s cubic-bezier(.7,0,.3,1) both}
@keyframes scin{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes scout{from{transform:scaleX(1)}to{transform:scaleX(0)}}

@media (prefers-reduced-motion:reduce){
  .slide *{animation:none!important}
  .in,.inL,.dl,.fillrect{opacity:1!important}.wipeR{clip-path:none}.d{stroke-dashoffset:0}.flip .inner{transform:none}.type{width:auto;border:0}
  .fx{display:none}
}
</style>
</head>
<body>
<div class="deck-viewport" id="vp">
 <div class="deck-stage" id="stage">
  <div id="slides"></div>
  <div class="drawer" id="drawer"><div class="k"><span id="dk"></span><button class="x" id="dx">Close ✕</button></div><h3 id="dh"></h3><div id="dp"></div></div>
  <div class="fx px" id="px"></div>
  <div class="fx bl" id="bl"></div>
  <div class="fx scan" id="scan" style="position:absolute"></div>
 </div>
</div>
<div id="read"><div class="w"><h1>Build an AI-native team</h1><div class="tip">Reading view · every slide, with its notes · press R or Esc to go back</div><div id="readList"></div></div></div>

function buildOV(){
 const uniq=[];META.forEach((m,i)=>{if(!uniq.length||uniq[uniq.length-1][0]!==m.s)uniq.push([m.s,i]);});
 ov.innerHTML=`<h3>Every slide</h3><div class="hint">Click one to jump · → next · ← back · G or Esc closes</div><div class="secs">${uniq.map(x=>`<button data-i="${x[1]}">${x[0]}</button>`).join('')}</div><div class="grid">${META.map((m,i)=>`<div class="th${i===cur?' cur':''}" data-i="${i}"><b>${String(i+1).padStart(2,'0')}</b>${m.th?`<img src="${m.th}" alt="">`:`<div style="aspect-ratio:16/9;padding:12px;font:400 15px/1.2 var(--serif)">${m.t}</div>`}</div>`).join('')}</div>`;
}
function openOV(){buildOV();ov.classList.add('on');ovOn=true;closeDrawer();}
function closeOV(){ov.classList.remove('on');ovOn=false;}
ov.addEventListener('click',e=>{const b=e.target.closest('[data-i]');if(!b)return;const n=+b.dataset.i;closeOV();if(n!==cur){slides[cur].classList.remove('active','leaving','incoming');cur=n;slides[cur].classList.add('active');closeDrawer();fillDrawer(n);try{history.replaceState(null,'','#'+(n+1));}catch(e){}}});

/* ---------- password gate ---------- */
const gate=document.createElement('div');gate.id='gate';
gate.innerHTML='<div class="tag">CASE STUDY · AI-ENABLING A UX TEAM</div><h1>Build an<br><em>AI-native team</em></h1><p>Enter the password to begin.</p><form autocomplete="off"><input type="password" id="pw" aria-label="Password" autocomplete="off" spellcheck="false"><button type="submit">Enter</button></form><div class="err" id="pwerr"></div>';
stage.appendChild(gate);
let gateOn=true;
const cy=(s,seed=0)=>{let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0,ch;i<s.length;i++){ch=s.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0);};
function unlock(){gateOn=false;gate.classList.add('off');setTimeout(()=>{gate.style.display='none';},700);const s0=slides[cur];s0.classList.remove('active');void s0.offsetWidth;s0.classList.add('active');try{sessionStorage.setItem('deckok','1');}catch(e){}}
let okAlready=false;try{okAlready=sessionStorage.getItem('deckok')==='1';}catch(e){}
if(okAlready||!gateOn){gateOn=false;gate.style.display='none';}
gate.querySelector('form').addEventListener('submit',e=>{e.preventDefault();const v=gate.querySelector('#pw').value.trim();if(cy(v)===2858555123870475){unlock();}else{gate.classList.remove('shake');void gate.offsetWidth;gate.classList.add('shake');$('#pwerr').textContent='Not quite. Try again.';gate.querySelector('#pw').select();}});
if(gateOn)setTimeout(()=>{try{gate.querySelector('#pw').focus();}catch(e){}},100);
fit();addEventListener('resize',fit);
fillDrawer(0);
window.eggOpen=function(o){const e=document.getElementById('egg');if(e)e.classList.toggle('on',!!o);};
addEventListener('keydown',e=>{
 if(document.querySelector('#egg.on')){if(e.key==='Escape')eggOpen(0);return;}
 if($('#read').classList.contains('on')){if(e.key==='Escape'||e.key==='r'||e.key==='R'){toggleRead();}return;}
 if(gateOn)return;
 const k=e.key;
 if(ovOn){if(k==='ArrowRight'){e.preventDefault();closeOV();if(cur===slides.length-1)go(0);else go(cur+1);}else if(k==='ArrowLeft'){e.preventDefault();closeOV();}else if(k==='Escape'||k==='g'||k==='G'){closeOV();}return;}
 if(k==='g'||k==='G'){openOV();return;}
 if(k==='ArrowRight'){e.preventDefault();go(cur+1);}
 else if(k==='ArrowLeft'){e.preventDefault();go(cur-1);}
 else if(k==='d'||k==='D'||k==='m'||k==='M'){drawer.classList.toggle('open');}
 else if(k==='Escape'){closeDrawer();document.querySelectorAll('.ppanel').forEach(p=>p.classList.remove('on'));document.querySelectorAll('.pcard').forEach(c=>c.classList.remove('sel'));}
 else if(k==='r'||k==='R'){toggleRead();}
 else if(k==='Home'){go(0);}else if(k==='End'){go(slides.length-1);}
});
vp.addEventListener('click',e=>{
 if(e.target.closest('.moreBtn')){drawer.classList.toggle('open');return;}
 if(e.target.closest('.gridBtn')){openOV();return;}
 const pc=e.target.closest('.pcard');
 if(pc){const sl=pc.closest('.slide'),k=pc.dataset.k,was=pc.classList.contains('sel');
  sl.querySelectorAll('.pcard').forEach(c=>c.classList.remove('sel'));sl.querySelectorAll('.pb').forEach(b=>b.classList.remove('on'));
  const pp=sl.querySelector('.ppanel');
  if(was){pp.classList.remove('on');}else{pc.classList.add('sel');sl.querySelector('.pb[data-k="'+k+'"]').classList.add('on');pp.classList.add('on');}
  return;}
 if(e.target.closest('#drawer')){if(e.target.closest('#dx'))closeDrawer();return;}
 if(drawer.classList.contains('open')){closeDrawer();return;}
 
});
let tx=null;vp.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});
vp.addEventListener('touchend',e=>{if(tx===null)return;const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>50)go(d<0?cur+1:cur-1);tx=null;});
/* reading view */
const list=$('#readList');
META.forEach((m,i)=>{const d=document.createElement('div');d.className='it';d.innerHTML=`<div class="n"><span>Slide ${String(i+1).padStart(2,'0')} · ${m.s}</span><a href="#${i+1}" data-j="${i}">Open slide</a></div><h2></h2><ul></ul>`;d.querySelector('h2').textContent=m.t;m.d.split('\n').forEach(x=>{if(!x.trim())return;const li=document.createElement('li');li.textContent=x.trim();d.querySelector('ul').appendChild(li);});list.appendChild(d);});
list.addEventListener('click',e=>{const a=e.target.closest('a');if(a){e.preventDefault();toggleRead();slides[cur].classList.remove('active');cur=+a.dataset.j;slides[cur].classList.add('active');fillDrawer(cur);}});
function toggleRead(){$('#read').classList.toggle('on');}
/* hash start + test hooks */
const h=parseInt(location.hash.slice(1),10);if(h>1&&h<=TOTAL){slides[0].classList.remove('active');cur=h-1;slides[cur].classList.add('active');fillDrawer(cur);}
window.__deck={jump:n=>{slides[cur].classList.remove('active','leaving','incoming');cur=n-1;slides[cur].classList.add('active');fillDrawer(cur);},go:n=>go(n-1),cur:()=>cur+1,open:()=>drawer.classList.add('open')};
})();
</script>
</body>
</html>
